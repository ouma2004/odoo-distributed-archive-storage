version: '3.1'

services:
  web:
    image: odoo:19.0
    depends_on:
      - db
    ports:
      - "9030:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    environment:
      - HOST=db
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata

  # Toute la configuration (y compris le mot de passe maître Odoo et le
  # token doc-archiver) vient de backup/backup-config.env, monté ci-dessous
  # et RELU EN CONTINU par le script : modifier ce fichier suffit, aucun
  # rebuild ni redémarrage de conteneur n'est nécessaire.
  #
  # Ce fichier n'est pas versionné (il contient deux secrets) — le créer
  # avant le premier démarrage :
  #     cp backup/backup-config.env.example backup/backup-config.env
  odoo-backup:
    build: ./backup
    depends_on:
      - web
    volumes:
      - ./backup/backup-config.env:/config/backup-config.env:ro
    restart: unless-stopped

volumes:
  odoo-web-data:
  odoo-db-data: